name: AWS DR Failover - EC2 Tokyo

on:
  workflow_dispatch:
    inputs:
      verify_cloudfront:
        description: "Verify CloudFront returns region-b (run after primary failure injection)"
        required: true
        type: boolean
        default: true
  repository_dispatch:
    types: [aws-cloudwatch-trigger]

permissions:
  id-token: write
  contents: read

concurrency:
  group: dr-lab-region-b-activation
  cancel-in-progress: false

jobs:
  recover:
    # Automatic trigger stays blocked until explicitly enabled tomorrow.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DR_ALLOW_AUTO == 'true' }}
    runs-on: ubuntu-latest
    environment: dr-lab
    timeout-minutes: 25
    env:
      AWS_REGION: ap-northeast-1
      AWS_ROLE_ARN: ${{ vars.AWS_DR_ROLE_ARN }}
      REGION_B_INSTANCE_ID: ${{ vars.REGION_B_INSTANCE_ID }}
      REGION_B_SECURITY_GROUP_ID: ${{ vars.REGION_B_SECURITY_GROUP_ID }}
      REGION_B_EIP: ${{ vars.REGION_B_EIP }}
      REGION_B_SSH_HOSTKEY_SHA256: ${{ vars.REGION_B_SSH_HOSTKEY_SHA256 }}
      CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
      VERIFY_CLOUDFRONT: ${{ github.event_name == 'repository_dispatch' || inputs.verify_cloudfront }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN REGION_B_INSTANCE_ID REGION_B_SECURITY_GROUP_ID REGION_B_EIP REGION_B_SSH_HOSTKEY_SHA256 CLOUDFRONT_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Environment variable $name"; exit 1; }
          done
          test -n "$SSH_PRIVATE_KEY" || { echo '::error::Missing ANSIBLE_SSH_KEY environment secret'; exit 1; }
          python3 -c 'import ipaddress,sys;ipaddress.IPv4Address(sys.argv[1])' "$REGION_B_EIP"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: skripsi-dr-github

      - name: Start EC2, deploy Ansible, verify recovery
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "start_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" > evidence/workflow-timestamps.txt
          echo "event_name=$GITHUB_EVENT_NAME" >> evidence/workflow-timestamps.txt
          echo "run_id=$GITHUB_RUN_ID" >> evidence/workflow-timestamps.txt
          echo "commit_sha=$GITHUB_SHA" >> evidence/workflow-timestamps.txt
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null

          aws ec2 start-instances --region "$AWS_REGION" --instance-ids "$REGION_B_INSTANCE_ID" > evidence/start-instances.json
          aws ec2 wait instance-running --region "$AWS_REGION" --instance-ids "$REGION_B_INSTANCE_ID"
          aws ec2 wait instance-status-ok --region "$AWS_REGION" --instance-ids "$REGION_B_INSTANCE_ID"
          echo "ec2_status_ok_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> evidence/workflow-timestamps.txt

          RUNNER_IP="$(curl --fail --silent --show-error --retry 3 https://checkip.amazonaws.com | tr -d '\r\n')"
          python3 -c 'import ipaddress,sys;ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          RUNNER_CIDR="$RUNNER_IP/32"
          GRANTED=0
          cleanup() {
            if [ "$GRANTED" = 1 ]; then
              aws ec2 revoke-security-group-ingress --region "$AWS_REGION" \
                --group-id "$REGION_B_SECURITY_GROUP_ID" --protocol tcp --port 22 \
                --cidr "$RUNNER_CIDR" >/dev/null || echo '::warning::SSH revoke failed: remove rule manually'
            fi
            rm -f "$HOME/.ssh/id_rsa"
          }
          trap cleanup EXIT
          aws ec2 authorize-security-group-ingress --region "$AWS_REGION" \
            --group-id "$REGION_B_SECURITY_GROUP_ID" --protocol tcp --port 22 \
            --cidr "$RUNNER_CIDR" > /dev/null
          GRANTED=1

          # Compare SSH host key obtained over the network with an expected fingerprint
          # verified independently via AWS EC2 console output or trusted administration.
          FOUND=0
          for i in $(seq 1 45); do
            if ssh-keyscan -T 5 -t ed25519 "$REGION_B_EIP" 2>/dev/null > "$HOME/.ssh/known_hosts" && [ -s "$HOME/.ssh/known_hosts" ]; then
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1 || { echo '::error::SSH not reachable'; exit 1; }
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          if [ "$ACTUAL_FINGERPRINT" != "$REGION_B_SSH_HOSTKEY_SHA256" ]; then
            echo '::error::SSH host key fingerprint mismatch'; exit 1
          fi

          python3 -m venv /tmp/skripsi-ansible-venv
          /tmp/skripsi-ansible-venv/bin/python -m pip install --quiet 'ansible-core>=2.17,<2.20'
          ANSIBLE_HOST_KEY_CHECKING=True \
            /tmp/skripsi-ansible-venv/bin/ansible-playbook \
            -i "${REGION_B_EIP}," -u ubuntu \
            --private-key "$HOME/.ssh/id_rsa" \
            ansible/failover-playbook.yml | tee evidence/ansible-output.log

          echo "ansible_complete_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> evidence/workflow-timestamps.txt
          python3 scripts/verify_dr.py --base-url "http://$REGION_B_EIP" --region region-b \
            --attempts 10 --interval 4 --output evidence/region-b-direct.json

          if [ "$VERIFY_CLOUDFRONT" = true ]; then
            python3 scripts/verify_dr.py --base-url "$CLOUDFRONT_URL" --region region-b \
              --attempts 30 --interval 5 --output evidence/region-b-cloudfront.json
          else
            echo 'CloudFront verification skipped by explicit manual workflow input' > evidence/cloudfront-skipped.txt
          fi
          echo "recovery_complete_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> evidence/workflow-timestamps.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
