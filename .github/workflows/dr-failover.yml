name: EC2 DR Failover - Manual vs Automatic Trigger

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aws-cloudwatch-trigger]

permissions:
  contents: read
  id-token: write

concurrency:
  group: dr-activation-region-b
  cancel-in-progress: false

jobs:
  activate-secondary:
    name: Start EC2 Region B and activate NGINX
    runs-on: ubuntu-latest
    environment: dr-lab
    timeout-minutes: 25
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Record experiment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'run_id=%s\ntrigger=%s\nstarted_at=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_SHA" | tee evidence/run-metadata.txt
          echo "### AWS EC2-only DR trial" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure temporary AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DR_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Start stopped Region B EC2 (identical for manual and auto)
        env:
          EC2_INSTANCE_ID_B: ${{ secrets.EC2_INSTANCE_ID_B }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_INSTANCE_ID_B:?Missing EC2_INSTANCE_ID_B}"
          CURRENT="$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID_B" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          printf 'region_b_previous_state=%s\n' "$CURRENT" >> evidence/run-metadata.txt
          if [[ "$CURRENT" != stopped ]]; then
            echo "::error::Controlled trials require Region B to be STOPPED before each trial (was $CURRENT)."
            exit 1
          fi
          echo "instance_start_requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/run-metadata.txt
          aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID_B" --output json > evidence/start-instance.json
          aws ec2 wait instance-status-ok --instance-ids "$EC2_INSTANCE_ID_B"
          echo "instance_status_ok_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/run-metadata.txt

      - name: Allow temporary SSH from runner IPv4 only
        id: ssh-ingress
        env:
          EC2_SECURITY_GROUP_ID_B: ${{ secrets.EC2_SECURITY_GROUP_ID_B }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_SECURITY_GROUP_ID_B:?Missing EC2_SECURITY_GROUP_ID_B}"
          PUBLIC_IP="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '\r\n')"
          [[ "$PUBLIC_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || exit 1
          CIDR="${PUBLIC_IP}/32"
          echo "cidr=$CIDR" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$EC2_SECURITY_GROUP_ID_B" \
            --protocol tcp --port 22 --cidr "$CIDR"

      - name: Prepare Ansible and verified SSH host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
          ANSIBLE_KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
          EC2_HOST_REGION_B: ${{ secrets.EC2_HOST_REGION_B }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'ansible-core>=2.18,<2.21'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          : "${SSH_PRIVATE_KEY:?Missing ANSIBLE_SSH_KEY}"
          : "${ANSIBLE_KNOWN_HOSTS:?Missing verified ANSIBLE_KNOWN_HOSTS}"
          : "${EC2_HOST_REGION_B:?Missing EC2_HOST_REGION_B}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ANSIBLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa" >/dev/null
          ssh-keygen -F "$EC2_HOST_REGION_B" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Activate NGINX on Region B (Ansible)
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          EC2_HOST_REGION_B: ${{ secrets.EC2_HOST_REGION_B }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ansible_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/run-metadata.txt
          ansible-playbook -i "${EC2_HOST_REGION_B}," -u ubuntu \
            --private-key "$HOME/.ssh/id_rsa" \
            -e 'ansible_ssh_common_args=-o StrictHostKeyChecking=yes' \
            ansible/failover-playbook.yml
          echo "ansible_finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/run-metadata.txt

      - name: Verify Region B application, not just successful pipeline
        env:
          EC2_HOST_REGION_B: ${{ secrets.EC2_HOST_REGION_B }}
          DR_FQDN: ${{ vars.DR_FQDN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_dr.py --url "http://${EC2_HOST_REGION_B}" \
            --expected-header region-b --timeout 150 --output evidence/region-b-direct.json
          echo "secondary_ready_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/run-metadata.txt
          if [[ -n "$DR_FQDN" ]]; then
            python3 scripts/verify_dr.py --url "http://${DR_FQDN}" \
              --expected-header region-b --timeout 240 --output evidence/region-b-dns.json
            echo "dns_failover_verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/run-metadata.txt
          else
            echo "DNS verification skipped: set GitHub Environment variable DR_FQDN" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Revoke temporary SSH rule even on failure
        if: ${{ always() && steps.ssh-ingress.outputs.cidr != '' }}
        env:
          EC2_SECURITY_GROUP_ID_B: ${{ secrets.EC2_SECURITY_GROUP_ID_B }}
          CIDR: ${{ steps.ssh-ingress.outputs.cidr }}
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$EC2_SECURITY_GROUP_ID_B" \
            --protocol tcp --port 22 --cidr "$CIDR"

      - name: Store evidence for BAB IV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-dr-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
