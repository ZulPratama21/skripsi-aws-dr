name: AWS DR OIDC Preflight (No Failover)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: dr-lab
    timeout-minutes: 5
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_DR_ROLE_ARN }}
      REGION_B_INSTANCE_ID: ${{ vars.REGION_B_INSTANCE_ID }}
    steps:
      - name: Check environment variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN" || { echo '::error::Missing AWS_DR_ROLE_ARN'; exit 1; }
          test -n "$REGION_B_INSTANCE_ID" || { echo '::error::Missing REGION_B_INSTANCE_ID'; exit 1; }

      - name: Assume DR role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: skripsi-dr-preflight

      - name: Read-only account and instance checks
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = '853679583110' || { echo '::error::Unexpected AWS account'; exit 1; }
          aws ec2 describe-instance-status --region ap-northeast-1 \
            --instance-ids "$REGION_B_INSTANCE_ID" --include-all-instances \
            --query 'InstanceStatuses[0].InstanceState.Name' --output text
          echo 'Preflight succeeded. No AWS resources were started, stopped or modified.'
