---
- name: Activate stateless HTTP disaster-recovery workload on Region B
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 180

    - name: Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy same application content as Region A
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
        content: |
          <!doctype html>
          <html lang="id">
          <head><meta charset="utf-8"><title>AWS DR Research Lab</title></head>
          <body>
            <h1>DR LABORATORY WORKLOAD - SERVICE OK</h1>
            <p>Stateless HTTP application for controlled recovery experiments.</p>
          </body>
          </html>

    - name: Deploy health endpoint
      ansible.builtin.copy:
        dest: /var/www/html/healthz
        owner: root
        group: root
        mode: '0644'
        content: "ready\n"

    - name: Mark HTTP responses as Region B
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/dr-region.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          add_header X-DR-Region "region-b" always;

    - name: Verify NGINX configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Start NGINX for recovery; disable boot-time autostart
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: false
